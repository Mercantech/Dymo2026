services:
  db:
    ports:
      - "5433:5432"

  api:
    ports:
      - "8080:8080"
    environment:
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000

  web:
    ports:
      - "3000:3000"
    labels:
      - traefik.enable=false

networks:
  default:
    name: dymotag-local
    external: false
